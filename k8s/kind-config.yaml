# kind cluster config for running Meridian Commerce on GitHub Codespaces (or
# any host without OrbStack/Docker-Desktop-style automatic LoadBalancer
# support). Plain kind never assigns an EXTERNAL-IP to `type: LoadBalancer`
# Services, so start.sh patches those Services to NodePort at the nodePorts
# below when it detects a kind context, and these extraPortMappings forward
# the same familiar localhost ports (8000, 9090, ...) to those nodePorts.
#
# Create with: kind create cluster --name meridian --config k8s/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: meridian
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30800   # api-gateway
        hostPort: 8000
        protocol: TCP
      - containerPort: 30801   # checkout-service
        hostPort: 8001
        protocol: TCP
      - containerPort: 30802   # inventory-service
        hostPort: 8002
        protocol: TCP
      - containerPort: 30803   # load-generator
        hostPort: 8003
        protocol: TCP
      - containerPort: 30804   # payment-service
        hostPort: 8004
        protocol: TCP
      - containerPort: 30909   # prometheus
        hostPort: 9090
        protocol: TCP
      - containerPort: 30913   # alertmanager
        hostPort: 9093
        protocol: TCP
      - containerPort: 30301   # grafana
        hostPort: 3001
        protocol: TCP
      - containerPort: 30310   # loki
        hostPort: 3100
        protocol: TCP
