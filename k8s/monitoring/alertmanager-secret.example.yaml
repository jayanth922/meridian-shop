# Copy this file to alertmanager-secret.yaml (gitignored), fill in the real
# cluster token shown when you connect this cluster in the Sentinel console
# (Clusters → Connect), then:
#
#   kubectl apply -f k8s/monitoring/alertmanager-secret.yaml
#   kubectl rollout restart deployment/alertmanager -n meridian
#
# start.sh never blocks on this Secret being absent — the app and the rest of
# the monitoring stack come up regardless; only the Alertmanager pod itself
# stays unready until this exists. The token is never committed to this repo.
apiVersion: v1
kind: Secret
metadata:
  name: meridian-alertmanager-secret
  namespace: meridian
type: Opaque
stringData:
  cluster-token: REPLACE_WITH_CLUSTER_TOKEN
